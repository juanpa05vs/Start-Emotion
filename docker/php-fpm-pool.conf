; Override del pool por defecto de la imagen php:8.4-fpm-alpine.
;
; El archivo php-fpm.conf incluye php-fpm.d/*.conf en orden alfabético, por lo
; que este archivo (zz-app-pool.conf) se carga DESPUÉS de www.conf y sobrescribe
; los valores del pool [www]. No redefine `listen` ni `user/group`, de modo que
; hereda el socket TCP 127.0.0.1:9000 y el usuario www-data de la imagen.
;
; Motivo: MySQL del usuario admite 5 conexiones y la aplicación abre 1 conexión
; por petición. Con pm.max_children = 3 cada instancia acota su concurrencia PHP
; y, por tanto, sus conexiones simultáneas a MySQL, dejando margen para
; administración y tareas puntuales.
[www]
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 300
