; Ajustes de producción para PHP 8.4 (imagen php:8.4-fpm-alpine).
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60

expose_php = Off

; OPcache: no revalidar ficheros en producción (se reinicia el contenedor al desplegar).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
