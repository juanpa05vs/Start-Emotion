name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP 8.4 · Node 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Run test suite
        run: php artisan test

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Informativo: no bloquea porque hay avisos conocidos en Laravel 11
      # (EOL) que requieren actualizar a Laravel 12. Ver informe de auditoría.
      - name: Audit dependencies
        continue-on-error: true
        run: composer audit --locked
