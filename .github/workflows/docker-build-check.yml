name: docker-build-check

# Verificacion aislada de que la imagen Docker compila.
#
# Garantias de seguridad:
# - NO despliega: no hay paso de deploy ni llamadas a Render.
# - NO publica imagenes: `push: false` y sin login a ningun registro.
# - NO arranca el contenedor: no hay `docker run`, por lo que NO se ejecuta el
#   ENTRYPOINT (ni `php artisan config:cache` ni `php artisan migrate`).
# - NO usa secretos de produccion.
# - NO se conecta a MySQL de Clever Cloud.
# - Permisos minimos: `contents: read`.
#
# Ejecucion manual: Actions -> docker-build-check -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build image (linux/amd64, sin push)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (solo compilacion; sin push, sin run)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
